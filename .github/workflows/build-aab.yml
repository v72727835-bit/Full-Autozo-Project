# Builds the signed Android App Bundles (.aab) for Google Play: customer, warehouse, rider and provider.
# Run it by hand: Actions > Build Play Store bundles > Run workflow. It needs the release signing secrets
# (see docs/PLAY-STORE.md) and stops with an error if they are missing, so a debug-signed bundle is never produced.
# Optional: GOOGLE_SERVICES_<APP> and MAPS_API_KEY, same as build-apks.yml.
name: Build Play Store bundles

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            dir: blinkit-app-
            firebase: GOOGLE_SERVICES_CUSTOMER
          - app: warehouse
            dir: autozo-warehouse
            firebase: GOOGLE_SERVICES_WAREHOUSE
          - app: rider
            dir: autozo-backend/autozo-mobile
            firebase: GOOGLE_SERVICES_RIDER
          - app: provider
            dir: autozo-provider
            firebase: GOOGLE_SERVICES_PROVIDER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the signing secrets exist
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KPW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS PW ALIAS KPW; do
            if [ -z "${!v}" ]; then echo "::error::Signing secret for $v is missing. See docs/PLAY-STORE.md."; exit 1; fi
          done

      - name: Add google-services.json
        env:
          JSON: ${{ secrets[matrix.firebase] }}
        run: |
          if [ -n "$JSON" ]; then
            printf '%s' "$JSON" > "${{ matrix.dir }}/android/app/google-services.json"
          else
            echo "::warning::${{ matrix.firebase }} secret not set - using the google-services.json in the repo (if any)."
          fi

      - name: npm install
        working-directory: ${{ matrix.dir }}
        run: npm install --no-audit --no-fund

      - name: gradlew bundleRelease
        working-directory: ${{ matrix.dir }}/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AUTOZO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUTOZO_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUTOZO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -e
          ks="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
          export AUTOZO_UPLOAD_STORE_FILE="$ks"
          trap 'rm -f "$ks"' EXIT
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/autozo-${{ matrix.app }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: autozo-${{ matrix.app }}-aab
          path: autozo-${{ matrix.app }}.aab
          retention-days: 30
