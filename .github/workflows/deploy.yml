name: CI and deploy to Autozo VPS

on:
  push:
    branches: [main]
    paths:
      - 'autozo-backend/**'
      - '!autozo-backend/autozo-mobile/**'
      - '!autozo-backend/autozo-app/**'
      - 'autozo-web/**'
      - 'autozo-admin/**'
      - 'deploy.sh'
      - 'update-apks.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autozo-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: autozo-backend
            path: autozo-backend
            build: npm run build
          - app: autozo-web
            path: autozo-web
            build: npx next build --webpack
          - app: autozo-admin
            path: autozo-admin
            build: npx next build --webpack
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - run: ${{ matrix.build }}
        env:
          NEXT_PUBLIC_API_URL: https://app-api.autozo.org/api/v1
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: --max-old-space-size=3072

  deploy:
    name: Deploy to Autozo VPS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Create release archive
        run: |
          tar --exclude='.git' \
            --exclude='node_modules' --exclude='.next' --exclude='build' \
            --exclude='.gradle' --exclude='autozo-*.apk' \
            -czf autozo-release.tar.gz -C . .
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SERVER_SSH_KEY" || { echo 'SERVER_SSH_KEY secret is missing'; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/autozo_deploy
          chmod 600 ~/.ssh/autozo_deploy
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          test -n "$SERVER_HOST" || { echo 'SERVER_HOST secret is missing'; exit 1; }
          scp -P "${SERVER_PORT:-22}" -i ~/.ssh/autozo_deploy \
            autozo-release.tar.gz "root@$SERVER_HOST:/tmp/autozo-release-${GITHUB_SHA}.tar.gz"
      - name: Deploy and smoke-test
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -p "${SERVER_PORT:-22}" -i ~/.ssh/autozo_deploy \
            -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "root@$SERVER_HOST" \
            "/usr/local/sbin/autozo-deploy /tmp/autozo-release-${GITHUB_SHA}.tar.gz ${GITHUB_SHA}"
