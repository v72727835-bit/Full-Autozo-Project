# Refreshes the APK downloads on the Autozo VPS without restarting the sites.
name: Update APKs on server

on:
  push:
    branches: [main]
    paths:
      - update-apks.sh
      - scripts/publish-apks.sh
      - .github/workflows/update-apks.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the APK publish script
        uses: actions/checkout@v4
        with:
          path: _repo
          sparse-checkout: scripts
      - name: Download latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'autozo-*.apk' --dir apks
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload APKs and refresh server files
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SERVER_PORT:-22}" -o BatchMode=yes \
            "root@$SERVER_HOST" 'mkdir -p /tmp/autozo-apks'
          scp -i ~/.ssh/id_deploy -P "${SERVER_PORT:-22}" -o BatchMode=yes \
            apks/autozo-*.apk "root@$SERVER_HOST:/tmp/autozo-apks/"
          ssh -i ~/.ssh/id_deploy -p "${SERVER_PORT:-22}" -o BatchMode=yes \
            "root@$SERVER_HOST" '/usr/local/sbin/autozo-update-apks /tmp/autozo-apks' \
            || echo "::warning::The server's own APK script failed; publishing directly below."
          # Publishes every autozo-*.apk (provider and any new app too) into the download folders.
          ssh -i ~/.ssh/id_deploy -p "${SERVER_PORT:-22}" -o BatchMode=yes \
            "root@$SERVER_HOST" 'bash -s -- /tmp/autozo-apks' < _repo/scripts/publish-apks.sh
